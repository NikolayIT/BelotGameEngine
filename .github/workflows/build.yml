name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The projects are built one by one; these four cover Belot.Engine and the three AI
      # projects through their project references. The MAUI app (src/UI/Belot.UI) needs the MAUI
      # workloads and is not built here; Belot.UI.Tests compiles its game layer and plays whole
      # games through it.
      - name: Build
        run: |
          dotnet build src/Tests/Belot.Engine.Tests/Belot.Engine.Tests.csproj -c Release
          dotnet build src/Tests/Belot.AI.ClaudePlayer.Tests/Belot.AI.ClaudePlayer.Tests.csproj -c Release
          dotnet build src/Tests/Belot.UI.Tests/Belot.UI.Tests.csproj -c Release
          dotnet build src/Tests/Belot.GamesSimulator/Belot.GamesSimulator.csproj -c Release

      - name: Test
        run: |
          dotnet test src/Tests/Belot.Engine.Tests/Belot.Engine.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"
          dotnet test src/Tests/Belot.AI.ClaudePlayer.Tests/Belot.AI.ClaudePlayer.Tests.csproj -c Release --no-build --logger "trx;LogFileName=claude-test-results.trx"
          dotnet test src/Tests/Belot.UI.Tests/Belot.UI.Tests.csproj -c Release --no-build --logger "trx;LogFileName=ui-test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: src/Belot.Engine/bin/Release/*.nupkg
          if-no-files-found: error
